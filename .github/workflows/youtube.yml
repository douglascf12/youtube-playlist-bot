name: YouTube -> Playlist News

on:
  workflow_dispatch:
  schedule:
    # Toda hora, no minuto 0 (UTC)
    - cron: "0 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v

      # Cache do state.json para preservar histórico entre execuções
      - name: Cache state
        uses: actions/cache@v4
        with:
          path: state.json
          key: youtube-state-${{ github.ref }}
          restore-keys: |
            youtube-state-

      - name: Run watcher
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YT_CHANNEL_PLAYLIST_MAP: ${{ secrets.YT_CHANNEL_PLAYLIST_MAP }}
        run: |
          python watcher.py
