name: YouTube -> Playlist (bot)

on:
  workflow_dispatch:
  schedule:
    # A cada 3 horas (UTC), no minuto 17: evita o pico do minuto 0,
    # quando o GitHub costuma atrasar ou pular execuções agendadas.
    # Horários em Brasília: 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17
    - cron: "17 */3 * * *"

# Nunca rodar duas execuções ao mesmo tempo (evita inserções duplicadas
# e corrida na gravação do state.json)
concurrency:
  group: youtube-playlist-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # Caches do GitHub são imutáveis: com chave fixa, o state.json nunca
      # seria regravado depois do primeiro save. Por isso a chave leva o
      # run_id e a restauração usa o prefixo (pega o mais recente).
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: youtube-state-${{ github.run_id }}
          restore-keys: |
            youtube-state-

      - name: Run watcher
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YT_CHANNEL_PLAYLIST_MAP: ${{ secrets.YT_CHANNEL_PLAYLIST_MAP }}
          # Parâmetros opcionais (Settings → Secrets and variables → Variables)
          MAX_VIDEOS_PER_CHANNEL: ${{ vars.MAX_VIDEOS_PER_CHANNEL }}
          MAX_VIDEO_AGE_DAYS: ${{ vars.MAX_VIDEO_AGE_DAYS }}
          LIKED_CACHE_TTL_HOURS: ${{ vars.LIKED_CACHE_TTL_HOURS }}
        run: python watcher.py

      # Salva o state mesmo se algum canal falhar
      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: youtube-state-${{ github.run_id }}
